name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Uses minimum_zig_version from build.zig.zon
      - uses: mlugg/setup-zig@v2

      - name: Build and package
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mkdir dist
          for target in \
            x86_64-linux-musl aarch64-linux-musl \
            x86_64-macos aarch64-macos \
            x86_64-windows aarch64-windows
          do
            name="zq-${tag}-${target}"
            zig build -Dtarget="${target}" -Doptimize=ReleaseFast -Dstrip=true --prefix "out/${target}"
            mkdir "${name}"
            cp README.md "${name}/"
            case "${target}" in
              *windows*)
                cp "out/${target}/bin/zq.exe" "${name}/"
                zip -qr "dist/${name}.zip" "${name}"
                ;;
              *)
                cp "out/${target}/bin/zq" "${name}/"
                tar -czf "dist/${name}.tar.gz" "${name}"
                ;;
            esac
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --title "zq ${GITHUB_REF_NAME}"
          fi
